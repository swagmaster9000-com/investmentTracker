{% extends "base.html" %}

{% block content %}
<div class="dashboard-container">
    
    <header class="dashboard-header">
        <h1>Investment Tracker Dashboard</h1>
        <div class="user-info">
            <span>Welcome, {{ user.username }}</span>
            <a href="{% url 'settings' %}" class="btn btn-secondary">Settings</a>
            <a href="{% url 'logout' %}" class="btn btn-danger">Logout</a>
        </div>
    </header>

    
    <main class="dashboard-main">
        
        <section class="portfolio-section">
            <h2>Your Portfolio</h2>
            <p>Placeholder for portfolio summary, charts, and balances.</p>
        </section>

        
        <section class="investments-section">
            <h2>Investments</h2>
            <p>Placeholder for investment list, performance, and details.</p>
        </section>
    </main>
</div>
{% endblock %}
