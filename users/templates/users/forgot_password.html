{% extends "base.html" %}
{% block content %}

<div class="card">
    <h2>Reset Your Password</h2>
    <p>Enter your username. You will then be redirected to reset your password.</p>

    <form method="post">
        {% csrf_token %}
        <input type="text" name="username" placeholder="Username" required>
        <button type="submit">Continue</button>
    </form>

    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}
    {% if success %}
        <p style="color:green;">{{ success }}</p>
    {% endif %}
</div>

{% endblock %}
