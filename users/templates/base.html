<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Investment Tracker</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f4f7;
        }

        /* NAVBAR */
        .navbar {
            background: #2c3e50;
            color: white;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 18px;
            font-weight: 500;
        }

        .navbar a:hover {
            text-decoration: underline;
        }

        /* PAGE WRAPPER */
        .content {
            padding: 40px;
            max-width: 900px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 7px rgba(0,0,0,0.12);
            margin-bottom: 25px;
        }

        .button {
            padding: 10px 18px;
            background: #3498db;
            color: white !important;
            text-decoration: none;
            border-radius: 8px;
            display: inline-block;
        }

        .button:hover {
            background: #217dbb;
        }

        input, select {
            padding: 10px;
            width: 95%;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            padding: 10px 18px;
            background: #2ecc71;
            border: none;
            color: white;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #27ae60;
        }
    </style>
</head>

<body>
    <div class="navbar">
        <div><strong>Investment Tracker</strong></div>
        <div>
            {% if request.user.is_authenticated %}
                <a href="/">Dashboard</a>
                <a href="{% url 'logout' %}">Logout</a>
            {% else %}
                <a href="{% url 'login' %}">Login</a>
                <a href="{% url 'signup' %}">Sign Up</a>
            {% endif %}
        </div>
    </div>

    <div class="content">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
